<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 300" role="img" aria-labelledby="t d">
  <title id="t">De información dispersa a un solo lugar</title>
  <desc id="d">Tres páginas web separadas, de becas, cursos y universidades, se unen en la aplicación EduMatch.</desc>
  <rect width="600" height="300" rx="16" fill="#F5F7FB"/>
  <!-- ventanas dispersas -->
  <g font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#1F2937">
    <g transform="translate(26 24) rotate(-4)">
      <rect width="170" height="82" rx="8" fill="#FFFFFF" stroke="#E1E6EF"/>
      <path d="M0 8 a8 8 0 0 1 8 -8 h154 a8 8 0 0 1 8 8 v14 h-170z" fill="#D6F0E8"/>
      <circle cx="14" cy="11" r="3" fill="#2FA88A"/>
      <text x="14" y="46">Páginas de becas</text>
      <rect x="14" y="56" width="110" height="6" rx="3" fill="#E1E6EF"/>
    </g>
    <g transform="translate(60 112) rotate(3)">
      <rect width="170" height="82" rx="8" fill="#FFFFFF" stroke="#E1E6EF"/>
      <path d="M0 8 a8 8 0 0 1 8 -8 h154 a8 8 0 0 1 8 8 v14 h-170z" fill="#FCE9C8"/>
      <circle cx="14" cy="11" r="3" fill="#F2A93B"/>
      <text x="14" y="46">Plataformas de cursos</text>
      <rect x="14" y="56" width="90" height="6" rx="3" fill="#E1E6EF"/>
    </g>
    <g transform="translate(20 200) rotate(-2)">
      <rect width="170" height="82" rx="8" fill="#FFFFFF" stroke="#E1E6EF"/>
      <path d="M0 8 a8 8 0 0 1 8 -8 h154 a8 8 0 0 1 8 8 v14 h-170z" fill="#DCE8F7"/>
      <circle cx="14" cy="11" r="3" fill="#1E5AA8"/>
      <text x="14" y="46">Sitios de universidades</text>
      <rect x="14" y="56" width="120" height="6" rx="3" fill="#E1E6EF"/>
    </g>
  </g>
  <!-- flechas -->
  <g fill="none" stroke="#1E5AA8" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 9">
    <path d="M200 66 C270 66 290 130 350 140"/>
    <path d="M234 154 C280 154 310 150 350 150"/>
    <path d="M194 240 C270 240 290 170 350 160"/>
  </g>
  <path d="M342 133 l14 7 -14 7z" fill="#1E5AA8"/>
  <!-- app -->
  <g transform="translate(372 22)">
    <rect width="190" height="256" rx="22" fill="#174a8c"/>
    <rect x="9" y="12" width="172" height="232" rx="14" fill="#FFFFFF"/>
    <rect x="9" y="12" width="172" height="44" rx="14" fill="#1E5AA8"/>
    <rect x="9" y="40" width="172" height="16" fill="#1E5AA8"/>
    <rect x="22" y="26" width="22" height="14" rx="4" fill="#F2A93B"/>
    <text x="52" y="38" font-family="Verdana, sans-serif" font-size="12" font-weight="bold" fill="#FFFFFF">EduMatch</text>
    <g font-family="Verdana, sans-serif" font-size="11" font-weight="bold" fill="#1F2937">
      <rect x="20" y="70" width="150" height="46" rx="8" fill="#D6F0E8"/><text x="32" y="98">Becas</text>
      <rect x="20" y="124" width="150" height="46" rx="8" fill="#FCE9C8"/><text x="32" y="152">Cursos</text>
      <rect x="20" y="178" width="150" height="46" rx="8" fill="#DCE8F7"/><text x="32" y="206">Intercambios</text>
    </g>
  </g>
</svg>
